# Benchmark stack (task 058): PostgreSQL, a seed job, both applications with
# the same CPU and memory limits, and k6 on demand.
#   docker compose up --build -d db seed vela sveltekit
#   docker compose run --rm k6 run -e BASE=http://vela:8081 /scripts/journey.js
# APP_CPUS selects the configuration (1 or 4); SvelteKit then runs
# APP_CPUS cluster workers and Go uses GOMAXPROCS=APP_CPUS.
x-limits: &limits
  cpus: "${APP_CPUS:-1}"
  mem_limit: 2g

services:
  db:
    image: postgres:18
    environment: { POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench }
    cpus: "2"
    healthcheck: { test: ["CMD", "pg_isready", "-U", "bench"], interval: 2s, retries: 30 }

  seed:
    build: { context: .., dockerfile: bench/vela-app/Dockerfile }
    command: ["/app/bin/seed", "-schema", "/app/shared/schema.sql", "-fixture", ""]
    environment: { DATABASE_URL: postgres://bench:bench@db:5432/bench?sslmode=disable }
    depends_on: { db: { condition: service_healthy } }

  vela:
    build: { context: .., dockerfile: bench/vela-app/Dockerfile }
    <<: *limits
    environment: { DATABASE_URL: postgres://bench:bench@db:5432/bench?sslmode=disable, GOMAXPROCS: "${APP_CPUS:-1}" }
    ports: ["8081:8081"]
    depends_on: { seed: { condition: service_completed_successfully } }

  sveltekit:
    build: { context: ., dockerfile: sveltekit-app/Dockerfile, args: { ORIGIN: "http://localhost:8082" } }
    <<: *limits
    environment: { DATABASE_URL: postgres://bench:bench@db:5432/bench?sslmode=disable, WORKERS: "${APP_CPUS:-1}" }
    ports: ["8082:8082"]
    depends_on: { seed: { condition: service_completed_successfully } }

  k6:
    image: grafana/k6:1.8.2
    profiles: [load]
    volumes: ["./shared/k6:/scripts:ro"]
    cpus: "2"
