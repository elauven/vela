name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    name: Go ${{ matrix.go }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go: ['1.25', 'stable']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      # The Go runtime is a nested module (ssr_runtime/go.mod, task 049); the
      # committed go.work lets both modules build and test together.
      # bash on every runner: PowerShell splits -coverprofile=coverage.out at
      # the dot.
      - name: Vet
        shell: bash
        run: go vet ./... ./ssr_runtime/...

      - name: Test
        shell: bash
        run: go test -v -race -coverprofile=coverage.out ./... ./ssr_runtime/...

      # go install builds the compiler without the workspace.
      - name: Build the compiler outside the workspace
        shell: bash
        env:
          GOWORK: "off"
        run: go build -o "$RUNNER_TEMP/vela-noworkspace" .

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.25'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out

  ssr-browser:
    name: SSR public browser baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install browser test dependencies
        # Pinned by the tracked package-lock.json (playwright 1.62.1).
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run required SSR browser baseline
        run: node tools/run-ssr-browser-baseline.mjs

      - name: Verify SSR browser gate failure accounting
        run: node tools/run-ssr-browser-baseline-self-test.mjs

  # The tests that bundle and run in Chromium skip without node_modules,
  # which the test job does not install.
  bundlers:
    name: Bundler plugin, recipes and SSR with Vite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install the bundlers
        # Pinned by package-lock.json: vite, rolldown, esbuild, unplugin.
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Bundle and run in Chromium
        env:
          VELA_REQUIRE_BUNDLERS: '1'
        run: go test -count=1 -v -run 'TestBundler|TestSSRWithVite|TestCompilerNpmPackage' .

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [test, ssr-browser, bundlers]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build all platforms
        run: |
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/vela-linux-amd64   .
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o dist/vela-linux-arm64   .
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o dist/vela-darwin-amd64  .
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o dist/vela-darwin-arm64  .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/vela-windows-amd64.exe .

      - name: Compile example components
        run: |
          ./dist/vela-linux-amd64 --out dist/js \
            examples/Counter.vela \
            examples/TodoList.vela \
            examples/Clock.vela

      - name: Report sizes
        run: |
          echo "📦 Compiler binaries:"
          ls -lh dist/vela-* | awk '{print "  " $5 "\t" $9}'
          echo ""
          echo "📦 Compiled JS:"
          ls -lh dist/js/*.js | awk '{print "  " $5 "\t" $9}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vela-binaries
          path: dist/vela-*
