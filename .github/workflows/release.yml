name: Release

# A tag vX.Y.Z (docs/RELEASING.md) builds the compiler for every platform,
# publishes a GitHub release with the binaries and their checksums, and
# publishes the npm packages of that version: the platform packages with the
# binaries, @govela/runtime, @govela/compiler and the bundler plugin
# @govela/unplugin. The Go runtime is released
# by its own tag ssr_runtime/vX.Y.Z, which needs no build.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Check the version
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(GOWORK=off go run . --version | cut -d' ' -f2)
          if [ "$got" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME, but Version in runtime/embed.go is $got" >&2
            exit 1
          fi

      - name: Test
        run: go test ./... ./ssr_runtime/...

      - name: Build all platforms
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/vela-$os-$arch$ext" .
          done
          (cd dist && sha256sum vela-* > SHA256SUMS)

      # The manifests are generated with Version (TestCompilerPackagesAreGenerated,
      # TestRuntimePackageIsGenerated); every package must carry the tag's version.
      - name: Check the npm package versions
        run: |
          want="${GITHUB_REF_NAME#v}"
          for manifest in packages/*/package.json; do
            node -e '
              const [file, want] = process.argv.slice(1);
              const m = JSON.parse(require("fs").readFileSync(file, "utf8"));
              const own = (deps) => Object.entries(deps ?? {}).filter(([name]) => name.startsWith("@govela/")).map(([, v]) => v);
              const wrong = [m.version, ...own(m.optionalDependencies), ...own(m.dependencies), ...own(m.peerDependencies)].filter((v) => v !== want);
              if (wrong.length) { console.error(`${file}: ${wrong.join(", ")}, want ${want}`); process.exit(1); }
            ' "$manifest" "$want"
          done

      - name: Put the binaries into the platform packages
        run: |
          for target in linux/amd64:linux-x64 linux/arm64:linux-arm64 darwin/amd64:darwin-x64 darwin/arm64:darwin-arm64 windows/amd64:win32-x64; do
            go=${target%%:*}; npm=${target#*:}
            os=${go%/*}; arch=${go#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            mkdir -p "packages/compiler-$npm/bin"
            cp "dist/vela-$os-$arch$ext" "packages/compiler-$npm/bin/vela$ext"
            chmod +x "packages/compiler-$npm/bin/vela$ext"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Vela $GITHUB_REF_NAME" --generate-notes --verify-tag

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Dependencies first: the platform packages before @govela/compiler,
      # the runtime and the compiler before @govela/unplugin. A version that is
      # already on npm is skipped, so a failed run can be repeated.
      - name: Publish the npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for dir in packages/compiler-* packages/runtime packages/compiler packages/unplugin; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            # "./": npm reads a bare "a/b" as the GitHub repository a/b.
            npm publish "./$dir" --access public --provenance
          done
