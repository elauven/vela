0 1 -4 4h-63.278688524590166z"/><text class="t1 val" x="137.27868852459017" y="245">171 ms <tspan class="t2 mult">· 2.7× less than Node</tspan></text><text class="t2 lbl" x="54" y="273" text-anchor="end">Bun</text><path class="s3" d="M62 258h236a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-236z"/><text class="t2 val" x="310" y="273">610 ms</text><text class="t2 lbl" x="54" y="301" text-anchor="end">Node</text><path class="s2" d="M62 286h177.7704918032787a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-177.7704918032787z"/><text class="t2 val" x="251.7704918032787" y="301">462 ms</text><line class="axis" x1="62" x2="62" y1="226" y2="310"/><text class="t1" x="460" y="196">CPU per JSON API request</text><text class="t2" x="460" y="214">CPU ms · lower is better</text><text class="t1 lbl" x="504" y="245" text-anchor="end">Vela</text><path class="s1" d="M512 230h121.00000000000001a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-121.00000000000001z"/><text class="t1 val" x="645" y="245">0.75 ms <tspan class="t2 mult">· 1.6× less than Bun</tspan></text><text class="t2 lbl" x="504" y="273" text-anchor="end">Bun</text><path class="s3" d="M512 258h194.33333333333331a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-194.33333333333331z"/><text class="t2 val" x="718.3333333333333" y="273">1.19 ms</text><text class="t2 lbl" x="504" y="301" text-anchor="end">Node</text><path class="s2" d="M512 286h236a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-236z"/><text class="t2 val" x="760" y="301">1.44 ms</text><line class="axis" x1="512" x2="512" y1="226" y2="310"/><text class="t1" x="10" y="366">Slowest request at 400 users</text><text class="t2" x="10" y="384">seconds · lower is better</text><text class="t1 lbl" x="54" y="415" text-anchor="end">Vela</text><path class="s1" d="M62 400h4.421052631578947a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-4.421052631578947z"/><text class="t1 val" x="78.42105263157895" y="415">1.0 s <tspan class="t2 mult">· 2.6× less than Bun</tspan></text><text class="t2 lbl" x="54" y="443" text-anchor="end">Bun</text><path class="s3" d="M62 428h17.894736842105264a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-17.894736842105264z"/><text class="t2 val" x="91.89473684210526" y="443">2.6 s</text><text class="t2 lbl" x="54" y="471" text-anchor="end">Node</text><path class="s2" d="M62 456h236a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-236z"/><text class="t2 val" x="310" y="471">28.5 s</text><line class="axis" x1="62" x2="62" y1="396" y2="480"/><text class="t1" x="460" y="366">Server memory</text><text class="t2" x="460" y="384">peak MB · lower is better</text><text class="t1 lbl" x="504" y="415" text-anchor="end">Vela</text><path class="s1" d="M512 400h18.298288508557455a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-18.298288508557455z"/><text class="t1 val" x="542.2982885085574" y="415">38 MB <tspan class="t2 mult">· 6.4× less than Bun</tspan></text><text class="t2 lbl" x="504" y="443" text-anchor="end">Bun</text><path class="s3" d="M512 428h138.5916870415648a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-138.5916870415648z"/><text class="t2 val" x="662.5916870415648" y="443">243 MB</text><text class="t2 lbl" x="504" y="471" text-anchor="end">Node</text><path class="s2" d="M512 456h236a4 4 0 0 1 4 4v12a4 4 0 0 1 -4 4h-236z"/><text class="t2 val" x="760" y="471">409 MB</text><line class="axis" x1="512" x2="512" y1="396" y2="480"/>
<text class="t2 note" x="10" y="520">SvelteKit 3 · Svelte 5 on Node 24 and Bun 1.4 against Vela · Go · one CPU core at 1.8 GHz, PostgreSQL 18, 64 users, median of three rounds</text>
</svg>
