<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vela Notes — Component Composition Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui,-apple-system,sans-serif; }

    :root {
      --purple:#7c3aed; --purple-light:#ede9fe; --purple-dark:#5b21b6;
      --tag-purple-bg:#ede9fe; --tag-purple-text:#5b21b6;
      --tag-green-bg:#d1fae5;  --tag-green-text:#065f46;
      --tag-blue-bg:#dbeafe;   --tag-blue-text:#1e40af;
      --tag-amber-bg:#fef3c7;  --tag-amber-text:#92400e;
      --tag-red-bg:#fee2e2;    --tag-red-text:#991b1b;
    }

    /* ── App shell ─────────────────────────────── */
    .app { min-height:100vh; background:#f8fafc; color:#111827; transition:background .3s,color .3s; }
    .app.dark { background:#0f172a; color:#e2e8f0; }

    /* Toolbar */
    .toolbar {
      position:sticky; top:0; z-index:10;
      background:white; border-bottom:1px solid #e5e7eb;
      padding:.75rem 1.5rem;
      display:flex; align-items:center; gap:.75rem; flex-wrap:wrap;
    }
    .app.dark .toolbar { background:#1e293b; border-color:#334155; }
    .brand { font-size:1.25rem; font-weight:800; color:var(--purple); letter-spacing:-.03em; }
    .search-box {
      flex:1; min-width:160px; padding:.4rem .85rem;
      border:1px solid #e5e7eb; border-radius:.5rem; font-size:.875rem; outline:none;
    }
    .app.dark .search-box { background:#0f172a; color:#e2e8f0; border-color:#334155; }
    .search-box:focus { border-color:var(--purple); }
    .tb-btn {
      padding:.4rem .85rem; border-radius:.5rem; border:1px solid #e5e7eb;
      background:white; font-size:.8rem; cursor:pointer; transition:all .15s; white-space:nowrap;
    }
    .app.dark .tb-btn { background:#1e293b; color:#e2e8f0; border-color:#334155; }
    .tb-btn:hover { background:#f3f4f6; }
    .app.dark .tb-btn:hover { background:#334155; }
    .tb-btn.primary { background:var(--purple); color:white; border-color:var(--purple); }
    .tb-btn.primary:hover { background:var(--purple-dark); }

    /* Stats */
    .stats-bar {
      padding:.5rem 1.5rem; background:#fafafa; border-bottom:1px solid #f3f4f6;
      display:flex; gap:1.5rem; font-size:.75rem; color:#9ca3af;
    }
    .app.dark .stats-bar { background:#1e293b; border-color:#334155; }
    .stat { display:flex; gap:.3rem; }
    .stat strong { color:#374151; }
    .app.dark .stat strong { color:#e2e8f0; }

    /* Layout */
    .layout { display:grid; grid-template-columns:200px 1fr; min-height:calc(100vh - 57px); }

    /* Sidebar */
    .sidebar {
      background:white; border-right:1px solid #e5e7eb;
      padding:1rem; display:flex; flex-direction:column; gap:1rem;
    }
    .app.dark .sidebar { background:#1e293b; border-color:#334155; }
    .sb-section { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#9ca3af; margin-bottom:.4rem; }
    .sort-list, .tag-list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:.15rem; }
    .sort-item, .tag-item {
      padding:.3rem .6rem; border-radius:.4rem; font-size:.8rem; cursor:pointer;
      color:#4b5563; transition:background .1s;
      display:flex; align-items:center; justify-content:space-between; gap:.5rem;
    }
    .app.dark .sort-item, .app.dark .tag-item { color:#94a3b8; }
    .sort-item:hover, .tag-item:hover { background:#f3f4f6; }
    .app.dark .sort-item:hover, .app.dark .tag-item:hover { background:#334155; }
    .sort-item.active, .tag-item.active { background:var(--purple-light); color:var(--purple-dark); font-weight:600; }
    .tag-count { font-size:.65rem; color:#9ca3af; background:#f3f4f6; padding:.05rem .35rem; border-radius:999px; }

    /* Notes area */
    .notes-area { padding:1.25rem; }
    .notes-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; gap:1rem; }
    .notes-count { font-size:.8rem; color:#9ca3af; }
    .active-filter {
      display:flex; align-items:center; gap:.4rem; padding:.25rem .6rem;
      background:var(--purple-light); border-radius:999px; font-size:.75rem; color:var(--purple-dark);
    }
    .clear-filter { background:none; border:none; font-size:.75rem; color:var(--purple-dark); cursor:pointer; }
    .notes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:.85rem; align-items:start; }

    /* NoteCard */
    .card {
      background:white; border:1px solid #e5e7eb; border-radius:.75rem; padding:1rem;
      cursor:pointer; transition:box-shadow .15s,border-color .15s,transform .1s;
      display:flex; flex-direction:column; gap:.5rem; position:relative;
    }
    .app.dark .card { background:#1e293b; border-color:#334155; color:#e2e8f0; }
    .card:hover { border-color:#d1d5db; box-shadow:0 4px 12px rgba(0,0,0,.06); transform:translateY(-1px); }
    .card-selected { border-color:var(--purple)!important; box-shadow:0 0 0 2px var(--purple-light)!important; }
    .card-pinned { border-color:#f59e0b!important; }
    .card-editing { cursor:default; transform:none!important; border-color:var(--purple)!important; box-shadow:0 0 0 3px var(--purple-light)!important; }
    .card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:.5rem; }
    .card-title { font-size:.95rem; font-weight:600; color:#111827; line-height:1.3; flex:1; }
    .app.dark .card-title { color:#e2e8f0; }
    .card-actions { display:flex; gap:.25rem; flex-shrink:0; opacity:0; transition:opacity .15s; }
    .card:hover .card-actions { opacity:1; }
    .card-editing .card-actions { opacity:1; }
    .action-btn {
      background:none; border:none; padding:.2rem .35rem; border-radius:.3rem;
      cursor:pointer; font-size:.75rem; color:#9ca3af; transition:color .1s,background .1s;
    }
    .action-btn:hover { color:#374151; background:#f3f4f6; }
    .action-btn.active { color:#f59e0b; }
    .action-btn.danger:hover { color:#ef4444; background:#fef2f2; }
    .card-body-text { font-size:.8rem; color:#6b7280; line-height:1.5; }
    .app.dark .card-body-text { color:#94a3b8; }
    .card-meta { display:flex; align-items:center; flex-wrap:wrap; gap:.5rem; margin-top:.25rem; }
    .word-count { font-size:.65rem; color:#d1d5db; margin-left:auto; }
    .tag-row { display:flex; align-items:center; flex-wrap:wrap; gap:.3rem; }

    /* Tag badges */
    .tag-badge {
      display:inline-flex; align-items:center; gap:.25rem; padding:.15rem .55rem;
      border-radius:999px; font-size:.7rem; font-weight:600; letter-spacing:.04em;
      text-transform:uppercase; white-space:nowrap; user-select:none;
    }
    .tag-rm-btn { background:none; border:none; padding:0; cursor:pointer; font-size:.65rem; opacity:.6; transition:opacity .15s; }
    .tag-rm-btn:hover { opacity:1; }

    /* Edit mode */
    .edit-area { display:flex; flex-direction:column; gap:.5rem; }
    .title-input, .body-input {
      width:100%; border:1px solid #d1d5db; border-radius:.375rem; font-family:inherit;
      font-size:.9rem; outline:none; transition:border-color .15s; background:#f9fafb;
    }
    .app.dark .title-input, .app.dark .body-input { background:#0f172a; color:#e2e8f0; border-color:#334155; }
    .title-input:focus, .body-input:focus { border-color:var(--purple); background:white; }
    .app.dark .title-input:focus, .app.dark .body-input:focus { background:#1e293b; }
    .title-input { padding:.35rem .6rem; font-weight:600; }
    .body-input { padding:.5rem .6rem; resize:vertical; min-height:80px; line-height:1.5; color:#374151; }
    .app.dark .body-input { color:#e2e8f0; }
    .edit-footer { display:flex; justify-content:flex-end; gap:.4rem; margin-top:.25rem; }
    .btn-save { padding:.3rem .85rem; background:var(--purple); color:white; border:none; border-radius:.375rem; font-size:.8rem; cursor:pointer; }
    .btn-cancel { padding:.3rem .75rem; background:#f3f4f6; color:#374151; border:none; border-radius:.375rem; font-size:.8rem; cursor:pointer; }
    .add-tag-btn { background:none; border:1px dashed #d1d5db; border-radius:999px; padding:.1rem .5rem; font-size:.65rem; color:#9ca3af; cursor:pointer; transition:all .15s; }
    .add-tag-btn:hover { border-color:var(--purple); color:var(--purple); }
    .tag-input { border:1px solid var(--purple); border-radius:999px; padding:.1rem .6rem; font-size:.7rem; outline:none; width:90px; }

    /* Empty state */
    .empty-state { grid-column:1/-1; text-align:center; padding:4rem 2rem; color:#9ca3af; }
    .empty-icon { font-size:2.5rem; margin-bottom:.75rem; }
    .empty-msg { font-size:.9rem; }
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  Vela Notes — self-contained interactive demo
//  Implements the same logic as NotesApp.vela + NoteCard.vela + TagBadge.vela
//  This is equivalent to what the Go compiler would emit for those components.
// ─────────────────────────────────────────────────────────────────────────────

const TAG_COLORS = ['purple','green','blue','amber','red'];
function tagColor(tag) {
  let h = 0;
  for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) & 0xffff;
  return TAG_COLORS[h % TAG_COLORS.length];
}

// ── App state ──────────────────────────────────────────────────────────────
let notes = [
  { id:1, title:'Welcome to Vela ⚡',   body:'Click any card to select it, ✏️ to edit, 📌 to pin. Try adding tags, searching, or switching the sort order!', tags:['vela','demo'], pinned:true },
  { id:2, title:'Reactive by default', body:'$state, $derived, and $effect give you fine-grained reactivity with zero runtime overhead. The compiler figures out exactly which DOM nodes to update.', tags:['reactive','state'], pinned:false },
  { id:3, title:'Component composition', body:'This app uses three Vela components: NotesApp, NoteCard, and TagBadge — each compiled to a self-contained ES module with scoped CSS.', tags:['components','slots'], pinned:false },
  { id:4, title:'Keyed #each lists',    body:'The notes grid uses #each with #key="note.id" for efficient keyed reconciliation — only changed cards re-render when the list mutates.', tags:['performance','each'], pinned:false },
  { id:5, title:'onMount & onDestroy',  body:'Global keyboard shortcuts (⌘N = new note, ⌘D = dark mode, Escape = clear) are wired in onMount and torn down in onDestroy.', tags:['lifecycle'], pinned:false },
];
let nextId     = 6;
let query      = '';
let filterTag  = '';
let darkMode   = false;
let selectedId = null;
let showStats  = false;
let sortBy     = 'pinned';
let editingId  = null;
let editTitle  = '';
let editBody   = '';
let newTag     = '';
let showTagFor = null;

// ── Derivations ─────────────────────────────────────────────────────────────
function allTags() {
  return [...new Set(notes.flatMap(n => n.tags))].sort();
}

function filtered() {
  return notes
    .filter(n => {
      const q = query.toLowerCase();
      const mq = !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q) || n.tags.some(t=>t.includes(q));
      const mt = !filterTag || n.tags.includes(filterTag);
      return mq && mt;
    })
    .sort((a,b) => {
      if (sortBy === 'pinned') { if (a.pinned !== b.pinned) return a.pinned ? -1 : 1; return b.id - a.id; }
      if (sortBy === 'alpha')  return a.title.localeCompare(b.title);
      if (sortBy === 'length') return b.body.length - a.body.length;
      return 0;
    });
}

function stats() {
  return {
    total:  notes.length,
    pinned: notes.filter(n=>n.pinned).length,
    words:  notes.reduce((s,n) => s + (n.body.trim() ? n.body.trim().split(/\s+/).length : 0), 0),
    tags:   allTags().length,
  };
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  document.title = `Notes (${notes.length})`;
  const root = document.getElementById('app');
  const vis = filtered();
  const st  = stats();
  const tags = allTags();

  root.innerHTML = '';
  const app = document.createElement('div');
  app.className = 'app' + (darkMode ? ' dark' : '');

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  toolbar.innerHTML = `
    <span class="brand">Notes</span>
    <input class="search-box" id="search" type="text" value="${escHtml(query)}" placeholder="Search notes… (⌘F)" />
    <button class="tb-btn" id="btn-stats">${showStats ? 'Hide stats' : 'Show stats'}</button>
    <button class="tb-btn" id="btn-dark">${darkMode ? '☀️' : '🌙'}</button>
    <button class="tb-btn primary" id="btn-new">+ New (⌘N)</button>
  `;
  app.appendChild(toolbar);

  // Stats bar
  if (showStats) {
    const sb = document.createElement('div');
    sb.className = 'stats-bar';
    sb.innerHTML = `
      <div class="stat"><span>Notes:</span><strong>${st.total}</strong></div>
      <div class="stat"><span>Pinned:</span><strong>${st.pinned}</strong></div>
      <div class="stat"><span>Words:</span><strong>${st.words}</strong></div>
      <div class="stat"><span>Tags:</span><strong>${st.tags}</strong></div>
    `;
    app.appendChild(sb);
  }

  // Layout
  const layout = document.createElement('div');
  layout.className = 'layout';

  // Sidebar
  const sidebar = document.createElement('div');
  sidebar.className = 'sidebar';
  sidebar.innerHTML = `
    <div>
      <div class="sb-section">Sort by</div>
      <ul class="sort-list">
        <li class="sort-item${sortBy==='pinned'?' active':''}" data-sort="pinned">📌 Pinned first</li>
        <li class="sort-item${sortBy==='alpha'?' active':''}"  data-sort="alpha">🔤 Alphabetical</li>
        <li class="sort-item${sortBy==='length'?' active':''}" data-sort="length">📏 Longest</li>
      </ul>
    </div>
    <div>
      <div class="sb-section">Filter by tag</div>
      <ul class="tag-list" id="tag-list">
        <li class="tag-item${filterTag===''?' active':''}" data-tag="">All notes<span class="tag-count">${notes.length}</span></li>
        ${tags.map(t => `<li class="tag-item${filterTag===t?' active':''}" data-tag="${escHtml(t)}">${escHtml(t)}<span class="tag-count">${notes.filter(n=>n.tags.includes(t)).length}</span></li>`).join('')}
      </ul>
    </div>
  `;
  layout.appendChild(sidebar);

  // Notes area
  const notesArea = document.createElement('div');
  notesArea.className = 'notes-area';

  const header = document.createElement('div');
  header.className = 'notes-header';
  header.innerHTML = `<span class="notes-count">${vis.length} note${vis.length===1?'':'s'}</span>`;
  if (query || filterTag) {
    header.innerHTML += `<div class="active-filter">Filtering: "${escHtml(query||filterTag)}" <button class="clear-filter" id="btn-clear">✕</button></div>`;
  }
  notesArea.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'notes-grid';

  if (vis.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `<div class="empty-icon">🗒</div><div class="empty-msg">${query||filterTag ? `No notes match "${escHtml(query||filterTag)}"` : 'No notes yet — add one!'}</div>`;
    grid.appendChild(empty);
  }

  vis.forEach(note => {
    const card = buildCard(note);
    grid.appendChild(card);
  });

  notesArea.appendChild(grid);
  layout.appendChild(notesArea);
  app.appendChild(layout);
  root.appendChild(app);

  // ── Wire events ────────────────────────────────────────────────────
  document.getElementById('search').oninput = e => { query = e.target.value; render(); };
  document.getElementById('search').onkeydown = e => { if (e.key === 'Escape') { query=''; render(); } };
  document.getElementById('btn-stats').onclick = () => { showStats = !showStats; render(); };
  document.getElementById('btn-dark').onclick  = () => { darkMode  = !darkMode;  render(); };
  document.getElementById('btn-new').onclick   = () => addNote();
  document.getElementById('btn-clear')?.onclick  = () => { query=''; filterTag=''; render(); };

  sidebar.querySelectorAll('.sort-item').forEach(el => {
    el.onclick = () => { sortBy = el.dataset.sort; render(); };
  });
  sidebar.querySelectorAll('.tag-item').forEach(el => {
    el.onclick = () => { filterTag = el.dataset.tag; render(); };
  });

  // Restore focus to search if it was active
  if (document.activeElement === document.body) {
    document.getElementById('search')?.focus?.();
  }
}

// ── Build a NoteCard ───────────────────────────────────────────────────────
function buildCard(note) {
  const card = document.createElement('div');
  const isEditing = editingId === note.id;
  card.className = 'card' +
    (selectedId === note.id ? ' card-selected' : '') +
    (note.pinned ? ' card-pinned' : '') +
    (isEditing  ? ' card-editing' : '');

  if (isEditing) {
    // ── Edit mode ──────────────────────────────────────────────────
    const tagRowHtml = note.tags.map(t => buildTagHtml(t, true)).join('') +
      (showTagFor === note.id
        ? `<input class="tag-input" id="tag-input-${note.id}" type="text" value="${escHtml(newTag)}" placeholder="tag…" />`
        : `<button class="add-tag-btn" data-noteid="${note.id}" id="btn-add-tag-${note.id}">+ tag</button>`);

    card.innerHTML = `
      <div class="edit-area">
        <input class="title-input" id="edit-title-${note.id}" type="text" value="${escHtml(editTitle)}" placeholder="Note title…" />
        <textarea class="body-input" id="edit-body-${note.id}" placeholder="Write something…">${escHtml(editBody)}</textarea>
        <div class="tag-row" id="tag-row-edit-${note.id}">${tagRowHtml}</div>
        <div class="edit-footer">
          <button class="btn-cancel" data-noteid="${note.id}" id="btn-cancel-${note.id}">Cancel</button>
          <button class="btn-save"   data-noteid="${note.id}" id="btn-save-${note.id}">Save</button>
        </div>
      </div>`;

    card.onclick = e => e.stopPropagation();

    requestAnimationFrame(() => {
      const ti = document.getElementById(`edit-title-${note.id}`);
      const bi = document.getElementById(`edit-body-${note.id}`);
      if (ti && !document.getElementById(`tag-input-${note.id}`)) ti.focus();

      ti?.addEventListener('input', e => { editTitle = e.target.value; });
      bi?.addEventListener('input', e => { editBody  = e.target.value; });
      ti?.addEventListener('keydown', e => { if (e.key === 'Escape') { editingId=null; render(); } });

      document.getElementById(`btn-save-${note.id}`)?.addEventListener('click', e => {
        e.stopPropagation();
        note.title = editTitle || 'Untitled';
        note.body  = editBody;
        editingId  = null;
        newTag = ''; showTagFor = null;
        render();
      });
      document.getElementById(`btn-cancel-${note.id}`)?.addEventListener('click', e => {
        e.stopPropagation();
        editingId = null; newTag=''; showTagFor=null; render();
      });
      document.getElementById(`btn-add-tag-${note.id}`)?.addEventListener('click', e => {
        e.stopPropagation();
        showTagFor = note.id; render();
        requestAnimationFrame(() => document.getElementById(`tag-input-${note.id}`)?.focus());
      });
      const tagInput = document.getElementById(`tag-input-${note.id}`);
      if (tagInput) {
        tagInput.value = newTag;
        tagInput.oninput = e => { newTag = e.target.value; };
        tagInput.onkeydown = e => {
          if (e.key === 'Enter') {
            const t = newTag.trim().toLowerCase();
            if (t && !note.tags.includes(t)) note.tags = [...note.tags, t];
            newTag=''; showTagFor=null; render();
          }
          if (e.key === 'Escape') { newTag=''; showTagFor=null; render(); }
        };
      }
      // Remove-tag buttons in edit mode
      card.querySelectorAll('.tag-rm-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const t = btn.dataset.tag;
          note.tags = note.tags.filter(x => x !== t);
          render();
        });
      });
    });

  } else {
    // ── View mode ──────────────────────────────────────────────────
    const preview = note.body.length > 120 ? note.body.slice(0,120) + '…' : note.body;
    const wc = note.body.trim() ? note.body.trim().split(/\s+/).length : 0;
    const tagsHtml = note.tags.map(t => buildTagHtml(t, false)).join('');

    card.innerHTML = `
      <div class="card-header">
        <span class="card-title">${note.pinned ? '📌 ' : ''}${escHtml(note.title)}</span>
        <div class="card-actions">
          <button class="action-btn${note.pinned?' active':''}" data-action="pin"   title="Pin">📌</button>
          <button class="action-btn" data-action="edit"  title="Edit">✏️</button>
          <button class="action-btn danger" data-action="delete" title="Delete">🗑</button>
        </div>
      </div>
      ${note.body ? `<p class="card-body-text">${escHtml(preview)}</p>` : ''}
      <div class="card-meta">
        <div class="tag-row">${tagsHtml}</div>
        ${wc > 0 ? `<span class="word-count">${wc}w</span>` : ''}
      </div>`;

    card.onclick = () => { selectedId = selectedId === note.id ? null : note.id; render(); };

    card.querySelector('[data-action="pin"]').addEventListener('click', e => {
      e.stopPropagation(); note.pinned = !note.pinned; render();
    });
    card.querySelector('[data-action="edit"]').addEventListener('click', e => {
      e.stopPropagation();
      editingId = note.id; editTitle = note.title; editBody = note.body;
      newTag=''; showTagFor=null; render();
      requestAnimationFrame(() => document.getElementById(`edit-title-${note.id}`)?.focus());
    });
    card.querySelector('[data-action="delete"]').addEventListener('click', e => {
      e.stopPropagation();
      notes = notes.filter(n => n.id !== note.id);
      if (selectedId === note.id) selectedId = null;
      if (editingId === note.id) editingId = null;
      render();
    });
  }

  return card;
}

function buildTagHtml(tag, removable) {
  const color = tagColor(tag);
  const style = `background:var(--tag-${color}-bg);color:var(--tag-${color}-text);`;
  return `<span class="tag-badge" style="${style}">
    ${escHtml(tag)}
    ${removable ? `<button class="tag-rm-btn" data-tag="${escHtml(tag)}">✕</button>` : ''}
  </span>`;
}

function addNote() {
  const note = { id: nextId++, title:'New note', body:'', tags:[], pinned:false };
  notes.unshift(note);
  editingId = note.id; editTitle = note.title; editBody = note.body;
  newTag=''; showTagFor=null; selectedId = note.id;
  render();
  requestAnimationFrame(() => document.getElementById(`edit-title-${note.id}`)?.focus());
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Global keyboard shortcuts (onMount pattern) ──────────────────────────
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'n') { e.preventDefault(); addNote(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'd') { e.preventDefault(); darkMode = !darkMode; render(); }
  if (e.key === 'Escape' && !editingId) { selectedId = null; query = ''; render(); }
});

// ── Initial render ──────────────────────────────────────────────────────
render();
</script>
</body>
